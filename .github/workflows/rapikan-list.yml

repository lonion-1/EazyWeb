name: Rapikan Benteng Pertahanan Isekai

on:
  push:
    branches: [ main, master ]
    paths:
      - 'easywhaleblocklist.txt'

permissions:
  contents: write

jobs:
  bersih-bersih:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Bersihkan spasi, duplikat, & urutkan
        run: |
          python3 -c '
          import datetime

          file_target = "easywhaleblocklist.txt"

          with open(file_target, "r", encoding="utf-8") as f:
              baris = f.readlines()

          aturan = set()
          for b in baris:
              b = b.strip()
              # Lewati baris kosong atau komentar
              if not b or b.startswith(("!", "#")):
                  continue
              # Hapus semua spasi nakal dan ubah ke huruf kecil
              b = b.replace(" ", "").lower()
              # Pastikan diawali || dan diakhiri ^ jika berupa domain biasa
              if not b.startswith(("||", "@@", "/")):
                  b = "||" + b
              if b.startswith("||") and not b.endswith("^") and "$" not in b:
                  b = b + "^"
              aturan.add(b)

          waktu = datetime.datetime.utcnow().strftime("%Y.%m.%d.%H%M")
          header = [
              "! Title: Benteng Pertahanan Dimensi Isekai (easyBlock)",
              "! Maintainer: EazyWhale",
              f"! Version: {waktu}",
              f"! Total Rules: {len(aturan)}",
              "! --------------------------------------------------",
              ""
          ]

          hasil = header + sorted(aturan)

          with open(file_target, "w", encoding="utf-8") as f:
              f.write("\n".join(hasil) + "\n")
          '

      - name: Simpan hasil rapi ke GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "EazyWhale Bot"
          git add easywhaleblocklist.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: rapikan list otomatis" && git push)

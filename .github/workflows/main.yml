name: Rapikan Benteng Pertahanan Isekai
# Copyright (c) 2026 <EazyWhale>
# Licensed under the MIT License. See scripts/LICENSE for details.

on:
  push:
    branches: [ main, master ]
    paths: 'EazyBlock.txt'
  workflow_dispatch: # <-- Memunculkan tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

concurrency:
  group: rapikan-list
  cancel-in-progress: false

jobs:
  bersih-bersih:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Bersihkan spasi, duplikat, & urutkan
        run: |
          python3 -c '
          import datetime, re

          file_target = "EazyBlock.txt"

          with open(file_target, "r", encoding="utf-8") as f:
              baris = f.readlines()

          aturan = set()
          for b in baris:
              b = b.strip()
              if not b or b.startswith(("!", "#", "[")):
                  continue
              if b.startswith(("@@", "/", "|http")) or "##" in b or "#@#" in b or "#?#" in b:
                  aturan.add(b)
                  continue
              b = re.sub(r"\s+", "", b).lower()
              if not b.startswith("||"):
                  b = "||" + b
              if "$" not in b and not b.endswith("^"):
                  b += "^"
              aturan.add(b)

          waktu = datetime.datetime.now(datetime.timezone.utc).strftime("%Y.%m.%d.%H%M")
          header = [
              "! Title: EazyWhale Isekai Wall",
              "! License: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)",
              "! Maintainer: EazyWhale",
              "! Expires: 1 hours",
              f"! Version: {waktu}",
              f"! Total Rules: {len(aturan)}",
              "! --------------------------------------------------",
              ""
          ]

          with open(file_target, "w", encoding="utf-8") as f:
              f.write("\n".join(header + sorted(aturan)) + "\n")
          '

      - name: Simpan hasil rapi ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EazyBlock.txt
          git diff --staged --quiet || (git commit -m "chore: rapikan list otomatis" && git push)
          

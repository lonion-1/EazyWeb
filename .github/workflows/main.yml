name: Rapikan Benteng Pertahanan Isekai
# Copyright (c) 2026 <EazyWhale>
# Licensed under the MIT License.

on:
  push:
    branches: [ main, master, blocker ]
    paths:
      - 'EazyBlock.txt'
  schedule:
    - cron: '37 21 * * 6' # Cek redundansi mingguan setiap Minggu jam 04:37 WIB
  workflow_dispatch:
    inputs:
      paksa:
        description: 'Lewati pengaman "terlalu banyak aturan terbuang"'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rapikan-list
  cancel-in-progress: false

jobs:
  bersih-bersih:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Bersihkan input, catat kelulusan ke hulu, & urutkan
        env:
          PAKSA: ${{ inputs.paksa }}
        run: python3 scripts/clean.py

      - name: Simpan hasil rapi ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EazyBlock.txt domains/EazyBlock.txt Graduated.txt README.md last-run.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "chore: rapikan list & catat kelulusan global"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1

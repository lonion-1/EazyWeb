name: Rapikan Benteng Pertahanan Isekai

on:
  push:
    branches: [ main, master ]
    paths:
      - 'EazyBlock.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rapikan-list
  cancel-in-progress: false

jobs:
  bersih-bersih:
    runs-on: ubuntu-latest
    # Hindari loop jika suatu saat pakai PAT
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Bersihkan spasi, duplikat, & urutkan
        run: python3 .github/scripts/rapikan.py

      - name: Simpan hasil rapi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EazyBlock.txt
          git diff --staged --quiet || (git commit -m "chore: rapikan list otomatis" && git pull --rebase && git push)

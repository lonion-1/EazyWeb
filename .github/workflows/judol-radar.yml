name: Radar Otomatis Domain Judol (Secondary Engine)
# Copyright (c) 2026 <EazyWhale>
# Licensed under the MIT License.

on:
  schedule:
    - cron: '17 20 * * *' # Cadangan harian jam 03:17 WIB (sebelum WhaleList build 04:23 WIB)
  repository_dispatch:
    types: [whaleindex-judol-batch, whaleindex-phishing-batch]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (tidak menulis apa pun)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rapikan-list
  cancel-in-progress: false

jobs:
  radar-judol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Pasang Python 3.12 (tomllib bawaan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validasi config radar
        run: python3 scripts/judol_radar.py --check-config

      - name: Pindai & verifikasi domain judol baru
        id: radar
        continue-on-error: true
        timeout-minutes: 14
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/judol_radar.py --dry-run
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python3 scripts/judol_radar.py --only feeds
          else
            python3 scripts/judol_radar.py
          fi

      - name: Jalankan Main Engine (clean.py) untuk deduplikasi & build
        run: python3 scripts/clean.py

      - name: Simpan hasil ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "chore(radar): auto-add domain judol terverifikasi [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Tandai merah bila radar gagal (setelah hasil tersimpan)
        if: steps.radar.outcome == 'failure'
        run: |
          echo "::error::Radar gagal — cek log step 'Pindai & verifikasi'. Main Engine & commit tetap dijalankan."
          exit 1

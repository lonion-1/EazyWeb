# ════════════════════════════════════════════════════════════════
#  PENALA — semua angka perilaku bot. Yang dihapus = pakai bawaan.
# ════════════════════════════════════════════════════════════════

# ── Waktu (Marathon Mode: 90 Menit) ──
time_budget_seconds = 5400         # 90 menit (bisa naik sampai 7200 / 2 jam)
finalize_reserve_seconds = 180     # 3 menit cukup untuk DNS massal + git push
polite_sleep = 0.25                # Agak santai dikit biar gak kena 429 di tengah jalan
http_trip_after = 3                # Beri 3x kesempatan karena waktu luang banyak

# ── Skoring (Verifikasi Total) ──
promote_at = 3
score_strong_domain = 3
score_moderate_domain = 1
score_context = 1
score_banner = 1
score_page_confirm = 3
confirm_min_score = 1
page_confirm_hits = 2
page_confirm_max_per_run = 800     # Cek isi halaman sampai 800 kandidat sekaligus!
page_recheck_days = 7

# ── Batas keamanan (Kuras Habis) ──
max_new_domains_per_run = 5000     # Plafon jumbo, nyaris tanpa rem
max_promoted_per_source = 300      # Kurangi sumbatan kalau nemu kanal/situs "tambang emas"
pending_ttl_days = 21
pending_max = 15000                # Kapasitas penampungan antrean raksasa
dns_fail_drop_days = 3
dns_workers = 64                   # 64 thread DNS di 4 vCPU Azure ngebut parah
dns_timeout_seconds = 4

# ── Kesehatan sumber ──
retire_hard_days = 4
retire_soft_days = 14
max_cooldown_hours = 72
parole_days = 30
reject_recheck_days = 30

# ── Telegram (Sapu Bersih Jaringan BFS) ──
tg_channels_per_run = 250          # Sikat 250 kanal per run
tg_max_channels = 500
tg_max_pages = 5                   # Gali lebih dalam sampai 5 halaman ke belakang
tg_max_dry_runs = 25
tg_verify_per_run = 150            # Percepat validasi kanal baru dari antrean
tg_discovery_queries_per_run = 15  # Perbanyak keyword discovery biar graf BFS mekar terus
tg_require_indonesian = true
tg_queue_max = 3000

# ── Situs komik (Sapuan Menyeluruh) ──
comic_sites_per_run = 100          # Hampir semua list komik disikat dalam 1 run
comic_max_sites = 200
comic_verify_per_run = 40
comic_deep_pages = 2               # Balikkan ke 2 chapter karena waktu sudah melimpah!
comic_verify_hits = 8

# ── crt.sh (Gali Lebih Dalam) ──
crt_batch_per_run = 25             # Naikkan batch dari 6 ke 25
crt_max_entries = 600              # Ambil lebih banyak entri sertifikat
crt_max_age_days = 120
crt_timeout = 30                   # Kasih napas 30 detik, kalau hang tetap di-skip
